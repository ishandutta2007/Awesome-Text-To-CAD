<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0F1F"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.65"/>
      <circle cx="40" cy="40" r="1.2" fill="#38BDF8" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatPrism {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .ambient-glow {
      transform-origin: 950px 210px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashMove 2.5s linear infinite;
    }
    .floating-cad {
      transform-origin: 950px 210px;
      animation: floatPrism 7s ease-in-out infinite;
    }
  </style>

  <!-- 1. Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#cadGrid)"/>

  <!-- 2. Ambient Glowing Orbs (Dynamic Background) -->
  <g class="ambient-glow">
    <circle cx="950" cy="210" r="180" fill="#6366F1" opacity="0.18" filter="url(#glow)"/>
    <circle cx="1020" cy="160" r="130" fill="#38BDF8" opacity="0.16" filter="url(#glow)"/>
    <circle cx="200" cy="80" r="120" fill="#A855F7" opacity="0.12" filter="url(#glow)"/>
  </g>

  <!-- 3. Dynamic Isometric CAD Wireframe (Right Side Background - No overlap with text) -->
  <g class="floating-cad" opacity="0.92">
    <!-- Isometric Coordinate Grid -->
    <g stroke="#38BDF8" stroke-width="1.2" opacity="0.4">
      <line x1="950" y1="210" x2="1140" y2="100"/>
      <line x1="950" y1="210" x2="760" y2="100"/>
      <line x1="950" y1="210" x2="950" y2="370"/>
    </g>

    <!-- Parametric 3D Solid / Mesh Geometry Wireframe -->
    <!-- Front/Top Iso Cube -->
    <polygon points="950,110 1060,170 950,230 840,170" fill="#1E293B" fill-opacity="0.55" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="840,170 950,230 950,340 840,280" fill="#0F172A" fill-opacity="0.75" stroke="#818CF8" stroke-width="2"/>
    <polygon points="950,230 1060,170 1060,280 950,340" fill="#1E1B4B" fill-opacity="0.65" stroke="#C084FC" stroke-width="2"/>

    <!-- Inner CAD Feature Construction Lines (Animated Dashes) -->
    <ellipse cx="950" cy="170" rx="55" ry="30" fill="none" stroke="#00F5FF" stroke-width="1.8" class="flow-line" filter="url(#subtleGlow)"/>
    <line x1="950" y1="170" x2="950" y2="280" stroke="#00F5FF" stroke-width="1.5" class="flow-line"/>
    <ellipse cx="950" cy="280" rx="55" ry="30" fill="none" stroke="#00F5FF" stroke-width="1.2" opacity="0.6"/>

    <!-- Geometric Dimension Marks / Precision Crosshairs -->
    <circle cx="840" cy="170" r="3.5" fill="#38BDF8" filter="url(#subtleGlow)"/>
    <circle cx="1060" cy="170" r="3.5" fill="#38BDF8" filter="url(#subtleGlow)"/>
    <circle cx="950" cy="110" r="3.5" fill="#C084FC" filter="url(#subtleGlow)"/>
    <circle cx="950" cy="340" r="3.5" fill="#818CF8" filter="url(#subtleGlow)"/>
    <circle cx="950" cy="230" r="4.5" fill="#00F5FF" filter="url(#glow)"/>

    <!-- CAD Dimension Label Pill -->
    <g transform="translate(1010, 310)">
      <rect width="90" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.85"/>
      <text x="45" y="17" fill="#38BDF8" font-size="11" font-weight="600" text-anchor="middle" class="code-font">B-REP: OK</text>
    </g>
  </g>

  <!-- 4. Subtle Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="12" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <rect x="12" y="12" width="1176" height="396" rx="8" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.5"/>

  <!-- 5. FOREGROUND CONTENT (Guaranteed high contrast, fully readable, unhidden) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="280" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="16" cy="15" r="4.5" fill="#38BDF8" filter="url(#subtleGlow)"/>
      <text x="32" y="19" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1.2" class="code-font">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title: AWESOME TEXT-TO-CAD -->
    <text x="0" y="160" fill="url(#titleGrad)" font-size="52" font-weight="900" letter-spacing="-1" class="sans-font" filter="url(#subtleGlow)">
      Awesome Text-To-CAD
    </text>

    <!-- Subtitle: Descriptive, SEO-Rich, Crisp -->
    <text x="0" y="206" fill="#F1F5F9" font-size="20" font-weight="500" class="sans-font">
      Natural Language to Parametric 3D Models, AI Copilots &amp; Code-Based CAD
    </text>
    <text x="0" y="234" fill="#94A3B8" font-size="15" font-weight="400" class="sans-font">
      The authoritative index of SaaS platforms, foundation geometry engines &amp; open-source pipelines.
    </text>

    <!-- Pipeline Flow Badges / Feature Pills -->
    <g transform="translate(0, 276)">
      <!-- Pill 1: Parametric B-Rep -->
      <g transform="translate(0, 0)">
        <rect width="185" height="38" rx="19" fill="url(#pillGrad)" stroke="#38BDF8" stroke-width="1.2"/>
        <text x="18" y="23" fill="#38BDF8" font-size="14">📐</text>
        <text x="44" y="24" fill="#E2E8F0" font-size="13" font-weight="600" class="sans-font">Parametric B-Rep</text>
      </g>

      <!-- Pill 2: LLM Copilots -->
      <g transform="translate(198, 0)">
        <rect width="175" height="38" rx="19" fill="url(#pillGrad)" stroke="#818CF8" stroke-width="1.2"/>
        <text x="18" y="23" fill="#818CF8" font-size="14">🤖</text>
        <text x="44" y="24" fill="#E2E8F0" font-size="13" font-weight="600" class="sans-font">LLM CAD Copilots</text>
      </g>

      <!-- Pill 3: Code CAD -->
      <g transform="translate(386, 0)">
        <rect width="180" height="38" rx="19" fill="url(#pillGrad)" stroke="#C084FC" stroke-width="1.2"/>
        <text x="18" y="23" fill="#C084FC" font-size="14">💻</text>
        <text x="44" y="24" fill="#E2E8F0" font-size="13" font-weight="600" class="sans-font">Code-to-CAD (KCL)</text>
      </g>

      <!-- Pill 4: Open-Source & SaaS -->
      <g transform="translate(578, 0)">
        <rect width="195" height="38" rx="19" fill="url(#pillGrad)" stroke="#34D399" stroke-width="1.2"/>
        <text x="18" y="23" fill="#34D399" font-size="14">⚡</text>
        <text x="44" y="24" fill="#E2E8F0" font-size="13" font-weight="600" class="sans-font">STEP, STL &amp; Assemblies</text>
      </g>
    </g>

    <!-- Bottom Tech Stack / Prompt Indicator -->
    <g transform="translate(0, 350)">
      <text x="0" y="15" fill="#64748B" font-size="12" class="code-font">
        PROMPT: "parametric bracket, 4mm holes, 6061-T6 aluminum" ➔ STEP / BREP SOLID MODEL
      </text>
    </g>
  </g>
</svg>
